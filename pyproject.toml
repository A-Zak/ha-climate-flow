[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-climate-flow"
version = "0.2.5"
description = "Home Assistant custom integration for ordered climate-control flows"
readme = "README.md"
requires-python = ">=3.14.2"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest-homeassistant-custom-component==0.13.346",
  "ruff==0.16.1",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["custom_components.climate_flow"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "UP"]
